{% extends "base.html" %}
{% block title %}Add Position — {{ election.title }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px;">
    <h2>Add Position</h2>
    <p style="color: #666;">Election: {{ election.title }}</p>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Add Position</button>
        <a href="{% url 'admin_election_detail' election.id %}" class="btn" style="background: #718096;">Cancel</a>
    </form>
</div>
{% endblock %}
