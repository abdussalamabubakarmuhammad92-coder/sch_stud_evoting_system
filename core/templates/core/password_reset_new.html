{% extends "base.html" %}
{% block title %}New Password — {{ organization.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Set New Password</h2>
    <p style="color: #666; margin-bottom: 20px;">{{ organization.name }}</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_password">New Password</label>
            {{ form.password }}
        </div>
        <div class="form-group">
            <label for="id_confirm_password">Confirm Password</label>
            {{ form.confirm_password }}
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%;">Update Password</button>
    </form>
</div>
{% endblock %}
