{% extends "base.html" %}
{% block title %}Password Reset — {{ organization.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Reset Password</h2>
    <p style="color: #666; margin-bottom: 20px;">{{ organization.name }}</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_matric_number">Matric Number</label>
            {{ form.matric_number }}
        </div>
        <button type="submit" class="btn" style="width: 100%;">Send Reset Code</button>
    </form>

    <p style="margin-top: 20px; text-align: center;">
        <a href="{% url 'voter_login' organization.slug %}">Back to Login</a>
    </p>
</div>
{% endblock %}
