{% extends "base.html" %}
{% block title %}Voter Login — {{ school_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Voter Login</h2>
    <p style="color: #666; margin-bottom: 20px;">{{ school_name }}</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_matric_number">Matric Number</label>
            {{ form.matric_number }}
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn" style="width: 100%;">Login</button>
    </form>

    <p style="margin-top: 20px; text-align: center;">
        <a href="{% url 'voter_register_step1' %}">Register</a> | 
        <a href="{% url 'password_reset_request' %}">Forgot Password?</a>
    </p>
</div>
{% endblock %}
