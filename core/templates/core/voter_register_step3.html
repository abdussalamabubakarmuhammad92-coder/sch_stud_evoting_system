{% extends "base.html" %}
{% block title %}Set Password — {{ organization.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Create Your Password</h2>
    <p style="color: #666; margin-bottom: 20px;">Step 3 of 3 — {{ organization.name }}</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_password">Password (min 8 characters)</label>
            {{ form.password }}
        </div>
        <div class="form-group">
            <label for="id_confirm_password">Confirm Password</label>
            {{ form.confirm_password }}
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%;">Complete Registration</button>
    </form>
</div>
{% endblock %}
